version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/symfony_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony_db
    volumes:
      - symfony_db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  symfony_db_data:
